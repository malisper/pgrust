[workspace.package]
edition = "2021"
publish = false

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

# Iterate on fast-profile (no LTO tail); numbers only from release/dist.
[profile.fast-profile]
inherits = "release"
lto = false
codegen-units = 16
# GL-ALPHA1-COUNTERS-1: keep the symbol table (release strips it) so the
# perf-profile ladder legs symbolize. ELF-sections-only — codegen unchanged.
strip = false

[profile.release]
debug = 0
strip = "symbols"
lto = "thin"
codegen-units = 1

# Optimized wasm artifact for the web demo (wasm). NATIVE-INERT:
# nothing native selects this profile; only wasm/wasm-build.sh's optional
# PGRUST_WASM_PROFILE=wasm-release leg uses it. Size-first (opt-level=s,
# symbols stripped, no LTO tail) so the module fits browser/iOS budgets.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = false
codegen-units = 16

# The official benchmark artifact.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# dist codegen with symbols kept — for perf attribution only, never a reported number's binary.
[profile.dist-prof]
inherits = "dist"
strip = false
debug = 1

[profile.profiling]
inherits = "release"
debug = 1
strip = false
