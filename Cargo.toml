[workspace]
resolver = "2"
members = [
    "crates/_support/types/types_error",
    "crates/_support/types/types_core",
    "crates/_support/mcx",
    "crates/_support/types/datum",
    "crates/_support/seam_core",
    "crates/_support/types/types_tuple",
    "crates/_support/types/stringinfo",
    "crates/common/hashfn",
    "crates/_support/types/fmgr",
    "crates/_support/types/types_scan",
    "crates/_support/types/types_guc",
    "crates/_support/types/types_dest",
    "crates/backend/access/common/heaptuple",
    "crates/backend/libpq/pqcomm_seams",
    "crates/backend/postmaster/syslogger_seams",
    "crates/backend/storage/ipc/ipc_seams",
    "crates/backend/utils/activity/pgstat_seams",
    "crates/backend/utils/init/init_small_seams",
    "crates/backend/utils/error/error_small_seams",
    "crates/backend/utils/error/elog_seams",
    "crates/backend/utils/misc/guc_tables",
    "crates/backend/utils/mb/mbutils_seams",
    "crates/backend/libpq/pqformat",
    "crates/_support/types/types_storage",
    "crates/_support/types/rel",
    "crates/_support/types/types_resowner",
    "crates/_support/types/types_slot",
    "crates/port/crc32c",
    "crates/backend/libpq/libpq_pqsignal",
    "crates/backend/storage/ipc/latch_seams",
    "crates/backend/storage/ipc/procsignal_seams",
    "crates/backend/utils/misc/guc_file_seams",
    "crates/backend/utils/mmgr/mcxt_seams",
    "crates/backend/postmaster/interrupt",
    "crates/backend/utils/error/elog",
    "crates/_support/types/hash",
    "crates/_support/pgrust/pg_ffi_fgram",
    "crates/_support/pgrust/trace",
    "crates/backend/utils/init/init_small",
    "crates/backend/utils/init/miscinit_seams",
    "crates/backend/utils/adt/acl_seams",
    "crates/backend/utils/misc/guc_seams",
    "crates/backend/utils/adt/numutils",
    "crates/_support/types/rel_vocab",
    "crates/backend/access/common/relation_seams",
    "crates/backend/catalog/pg_class_seams",
    "crates/backend/access/table/table_seams",
    "crates/backend/access/table/table",
    "crates/_support/types/snapshot",
    "crates/_support/types/portal",
    "crates/_support/types/array",
    "crates/_support/types/types_nbtree",
    "crates/common/wchar",
    "crates/_support/types/nodes",
    "crates/backend/storage/lmgr/lmgr_proc_seams",
    "crates/backend/storage/lmgr/s_lock_seams",
    "crates/backend/utils/activity/waitevent_seams",
    "crates/backend/storage/ipc/shmem_seams",
    "crates/backend/storage/lmgr/lwlock",
    "crates/backend/storage/file/file_seams",
    "crates/backend/storage/sync/sync_seams",
    "crates/backend/access/transam/transam_xlog_seams",
    "crates/backend/access/transam/xlogutils_seams",
    "crates/backend/access/transam/slru",
    "crates/backend/utils/cache/relcache_seams",
    "crates/backend/utils/cache/syscache_seams",
    "crates/backend/utils/cache/inval_seams",
    "crates/backend/storage/lmgr/lmgr_seams",
    "crates/backend/catalog/namespace_seams",
    "crates/backend/access/transam/xact_seams",
    "crates/backend/access/common/relation",
]

[workspace.package]
edition = "2021"
publish = false

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

# Iterate on fast-profile (no LTO tail); numbers only from release/dist.
[profile.fast-profile]
inherits = "release"
lto = false
codegen-units = 16

[profile.release]
debug = 0
strip = "symbols"
lto = "thin"
codegen-units = 1

# The official benchmark artifact.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = 1
strip = false
