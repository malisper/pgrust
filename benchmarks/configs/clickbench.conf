# ---------------------------------------------------------------------------
# ClickBench server configuration.
#
# PROVENANCE: this is ClickBench's own PostgreSQL configuration formula, from
# the `postgresql/install` script in https://github.com/ClickHouse/ClickBench,
# applied verbatim, plus one setting pgrust requires.
#
# The upstream formula is derived from the machine, not hand-picked:
#
#     shared_buffers                   = MemTotal / 4
#     effective_cache_size             = MemTotal - MemTotal / 4
#     max_worker_processes             = nproc + 15
#     max_parallel_workers             = nproc
#     max_parallel_maintenance_workers = nproc / 2
#     max_parallel_workers_per_gather  = nproc / 2
#     max_wal_size                     = 32GB
#     work_mem                         = 64MB
#
# We use the formula rather than fixed numbers on purpose: it is what every
# other PostgreSQL-family entry on the ClickBench leaderboard uses, so keeping
# it means our row was produced the same way theirs were. Hand-tuning here
# would make the comparison ours rather than ClickBench's.
#
# On this box (c8g.4xlarge, 16 vCPU, ~32 GB) the formula resolves to roughly:
#
#     shared_buffers                   ~ 7.7GB
#     effective_cache_size             ~ 23GB
#     max_worker_processes             = 31
#     max_parallel_workers             = 16
#     max_parallel_maintenance_workers = 8
#     max_parallel_workers_per_gather  = 8
#
# The values actually in force are the ones in the live datadir's
# postgresql.conf, and can be read back from a running server:
#
#     SELECT name, setting, source FROM pg_settings
#      WHERE name IN ('shared_buffers','effective_cache_size','work_mem',
#                     'max_worker_processes','max_parallel_workers',
#                     'max_parallel_workers_per_gather','max_wal_size',
#                     'io_method');
#
# Trust that output over this file.
# ---------------------------------------------------------------------------

# --- required by pgrust ----------------------------------------------------
# Not part of the upstream formula. pgrust requires synchronous I/O; this is
# the one deviation from the stock ClickBench PostgreSQL configuration.
io_method = sync

# --- determinism -----------------------------------------------------------
# The official cut pins both to GMT so that timestamp-sensitive queries cannot
# vary with the host's timezone.
timezone = 'GMT'
log_timezone = 'GMT'

# --- load-phase only -------------------------------------------------------
# The load path raises work_mem to 1GB for the sort that precedes the bulk
# COPY, then the server runs the query sweep at the formula's 64MB. This is a
# load-time setting, not a query-time one; the scored sweep does not see it.
#
#   work_mem = 1GB     # during load only

# --- engine posture --------------------------------------------------------
# The official cut ran with STOCK engine defaults: zero pgrust-specific
# tuning knobs were set. There is no environment-variable posture to
# reproduce. If you find yourself needing to set a pgrust-specific variable to
# reproduce our number, that is a finding and we would like to hear it.
