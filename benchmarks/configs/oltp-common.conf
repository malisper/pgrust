# ---------------------------------------------------------------------------
# The OLTP comparison configuration. Applied IDENTICALLY to both engines:
# pgrust and C PostgreSQL 18.3. Any asymmetry here would invalidate the
# comparison, so this single file is the source of truth for both arms.
#
# Provenance: PlanetScale's published raw-Postgres configuration frame
# (https://planetscale.com/blog/benchmarking-postgres-17-vs-18), plus two
# settings pgrust requires, applied to both sides for parity.
# ---------------------------------------------------------------------------

# --- PlanetScale's published frame -----------------------------------------
shared_buffers = 16GB
effective_cache_size = 48GB        # planner hint, not an allocation; their
                                   # published value, kept for fidelity even
                                   # though this box has 32GB
work_mem = 64MB
effective_io_concurrency = 200
max_parallel_workers = 8

# --- required to run the benchmark at all ----------------------------------
listen_addresses = '*'
max_connections = 500

# --- required by pgrust; applied to C as well, for parity ------------------
# io_method=sync forgoes PostgreSQL 18's newer asynchronous I/O paths. This
# means the C arm is not "stock-tuned PostgreSQL 18.3". It is applied to both
# arms so neither is advantaged, but the auditor should know it is here.
io_method = sync
max_stack_depth = 60000

# --- rig hygiene, identical on both ----------------------------------------
# The NVMe holds four datadirs and is tight on space; an unbounded WAL can
# fill it mid-run and kill a benchmark leg.
max_wal_size = 8GB

# autovacuum is left ON, at defaults, on both arms. Turning it off would be
# unrepresentative, and a dead autovacuum worker silently starves the planner
# of statistics — a failure mode that has produced misleading numbers here
# before. Check the logs after long runs.
