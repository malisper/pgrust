# ---------------------------------------------------------------------------
# GL-AUDITKIT-1 comparison configuration.
# PlanetScale published raw-Postgres frame + two parity settings (io_method,
# max_stack_depth) + max_wal_size for the tight instance-store budget.
# This ONE file is included by all four datadirs (pgrust and C PostgreSQL 18.3)
# so the two arms are byte-identically configured by construction.
# ---------------------------------------------------------------------------
shared_buffers = 16GB
effective_cache_size = 48GB
work_mem = 64MB
effective_io_concurrency = 200
max_parallel_workers = 8
listen_addresses = '*'
max_connections = 500
io_method = sync
max_stack_depth = 60000
max_wal_size = 8GB
