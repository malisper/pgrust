# crash-simulator — H1 sim-harness core (contract: harness-h1-contract.md §0 A2).
#
# OWN cargo workspace, deliberately NOT a member of the repo root workspace:
# client-side deps here must never enter the product build closure (zero-cost
# gate, builds-on-fleet law). WS-RUNNER owns this manifest going forward;
# WS-ORACLE bootstrapped this copy with the deps the oracle needs (serde,
# serde_json, rand/rand_chacha, sha2 — aligned with the WS-GEN/WS-RUNNER
# bootstraps — plus regex for the triage.py screen ports and toml for
# warts.toml). Integration merge: union the [dependencies] tables; bin
# targets belong to WS-RUNNER (src/main.rs) / WS-GEN (simharness-gen).
[workspace]

[package]
name = "simharness"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "simharness"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
sha2 = "0.10"
regex = "1"
toml = "0.8"
