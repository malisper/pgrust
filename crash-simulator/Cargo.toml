# crash-simulator — H1 sim-harness core (contract: harness-h1-contract.md §0 A2).
#
# OWN cargo workspace, deliberately NOT a member of the repo root workspace:
# client-side deps here must never enter the product build closure (zero-cost
# gate, builds-on-fleet law). WS-RUNNER owns this manifest going forward;
# integration union of the WS-GEN / WS-ORACLE / WS-RUNNER bootstraps
# (regex + toml from WS-ORACLE for the triage.py screen ports and warts.toml).
[workspace]

[package]
name = "simharness"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "simharness"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
sha2 = "0.10"
regex = "1"
toml = "0.8"

[[bin]]
# Bootstrap gen-only CLI (WS-GEN). WS-RUNNER's `simharness` binary (src/main.rs)
# supersedes this for run/replay; this bin stays as the gen-only smoke tool.
name = "simharness-gen"
path = "src/bin/simharness_gen.rs"
