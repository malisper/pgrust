[package]
name = "mcx"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "mcx"
path = "src/lib.rs"

[features]
# aset-guard: back each chunk with an mmap'd region abutting a PROT_NONE guard
# page so overruns fault at the offending write. Debugging only.
aset-guard = ["dep:libc"]
# aset-stats: count keeper-block mallocs / recycle reuses via mcx::alloc_stats().
aset-stats = []

[dependencies]
types_error = { path = "../types/types_error" }
libc = { version = "0.2", optional = true }
allocator-api2 = { version = "0.2", default-features = false, features = ["alloc"] }
hashbrown = { version = "0.14", default-features = false, features = ["allocator-api2", "ahash", "inline-more"] }
bumpalo = { version = "3", default-features = false, features = ["allocator-api2"] }
