# What this binary links is a FEATURE LIST, not a fixed set. seams_init is the
# only place a subsystem enters the postgres binary (its path dep plus the
# `init_seams()` call below it), so making a dependency `optional = true` and
# putting a `cfg` on its init call is the whole mechanism: feature off => the
# crate is not in the link graph at all, and the subsystem's seams are never
# installed. A contrib whose crate is gone no longer registers its named
# builtin library with dfmgr, so `CREATE EXTENSION` fails with PostgreSQL's own
# "could not access file" error; a core builtin whose crate is gone resolves to
# fmgr's existing `NotPorted` stub, an error at call time.
#
# TIER A (replication, parallel, backup) is DECLARED BUT UNTESTED OFF: the
# postmaster touches these at BOOT, and a seam that is called with nothing
# installed panics `seam not installed` (crates/_support/seam_core). They are on
# in every profile here. TIER B (index-*, tsearch, geo, jsonpath, pgrcolumnar,
# plpgsql) is reached only through fmgr/pg_am dispatch and is safe off by
# construction -- also on in every profile here. NOTHING below changes the
# default build: `default = ["full"]` is exactly the dependency set and the
# init order that existed before this section was added.
#
# Crates a feature CANNOT remove, because a non-seams_init crate in main_main's
# graph depends on them too (`cargo tree -i <crate> -p main_main`). The feature
# is still declared -- it stops seams_init installing the seams -- but the code
# stays in the module:
#   bloom, pgvector, pgvector_hnsw   <- amapi, indexam, planner, catalog_index
#   tsm_system_rows, tsm_system_time <- tablesample
#   dict_snowball, ts_cache          <- fmgr_core (and to_tsany, wparser_def)
#   adt_tsginidx                     <- gin
#   adt_geo                          <- regress_lib
#   gin, brin_*, spgist_*            <- indexam, planner, catalog_index, autovacuum
#   parallel, bgworker               <- execmain, launch_backend, postmaster, ...
#   slot, origin, logical, snapbuild, reorderbuffer, walsender, walreceiver,
#   slotsync, slotfuncs, launcher, walsender_config, walreceiverfuncs
#                                    <- ipci, postmaster, subscriptioncmds, ...
# `jsonpath` (adt_jsonpath, adt_jsonpath_exec) and `pgrcolumnar` are not
# seams_init dependencies at all -- core calls them directly (pgrcolumnar <-
# copy_cmd, postgres, tableam, tablecmds) -- so their features are declared
# empty and gate nothing. The build script proves the real exclusion set from
# `cargo tree`, so none of this has to be believed.
[features]
default = [
    "full",
]
full = [
    "contrib-all",
    "replication",
    "parallel",
    "backup",
    "index-gin",
    "index-gist",
    "index-spgist",
    "index-brin",
    "tsearch",
    "geo",
    "jsonpath",
    "pgrcolumnar",
    "plpgsql",
]
contrib-all = [
    "contrib-amcheck",
    "contrib-auto_explain",
    "contrib-bloom",
    "contrib-btree_gin",
    "contrib-btree_gist",
    "contrib-citext",
    "contrib-cube",
    "contrib-dblink",
    "contrib-earthdistance",
    "contrib-file_fdw",
    "contrib-fuzzystrmatch",
    "contrib-hstore",
    "contrib-injection_points",
    "contrib-intarray",
    "contrib-isn",
    "contrib-lo",
    "contrib-ltree",
    "contrib-pageinspect",
    "contrib-passwordcheck",
    "contrib-pg_buffercache",
    "contrib-pg_freespacemap",
    "contrib-pg_logicalinspect",
    "contrib-pg_overexplain",
    "contrib-pg_prewarm",
    "contrib-pg_stat_statements",
    "contrib-pg_surgery",
    "contrib-pg_trgm",
    "contrib-pg_visibility",
    "contrib-pg_walinspect",
    "contrib-pgcrypto",
    "contrib-pgoutput",
    "contrib-pgrowlocks",
    "contrib-pgstattuple",
    "contrib-pgvector",
    "contrib-pgvector_hnsw",
    "contrib-postgres_fdw",
    "contrib-seg",
    "contrib-sslinfo",
    "contrib-tablefunc",
    "contrib-tcn",
    "contrib-test_custom_types",
    "contrib-test_decoding",
    "contrib-test_oat_hooks",
    "contrib-tsm_system_rows",
    "contrib-tsm_system_time",
    "contrib-unaccent",
    "contrib-uuid_ossp",
]
