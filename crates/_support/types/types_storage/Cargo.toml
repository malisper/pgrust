[package]
name = "types_storage"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
# PageAddItemExtended's elog(WARNING) arms (bufpage.c:235/292/299) report on
# elog's ereport_msg seam from inside the page code, as C does; seam-only
# dependency (seam_core + types_error), no cycle.
elog_seams = { path = "../../../backend/utils/error/elog_seams" }
libc = { version = "0.2", default-features = false }
mcx = { path = "../../mcx" }
# THE single lock library (permit-s1): latch.rs's atomics ride pgsync so the
# latch protocol is directly loom-modelable. Native/sim = std re-exports
# (zero cost); pgsync's deps (pg_clock, pg_strong_random) are leaf port
# crates — no cycle.
pgsync = { path = "../../pgsync" }
types_core = { path = "../types_core" }
types_error = { path = "../types_error" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)", "cfg(pgrust_sim)"] }
