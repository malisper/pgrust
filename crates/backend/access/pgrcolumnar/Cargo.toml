[package]
name = "pgrcolumnar"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[features]
bench-internals = []

[dependencies]
# permit-s4 row 10: stitch-pool feed channels on pgsync::mailbox.
pgsync = { path = "../../../_support/pgsync" }
libc = "0.2"
vfs = { path = "../../storage/file/vfs" }
lz4_flex = "0.11"
mcx = { path = "../../../_support/mcx" }
datum = { path = "../../../_support/types/datum" }
types_core = { path = "../../../_support/types/types_core" }
types_error = { path = "../../../_support/types/types_error" }
types_rel = { path = "../../../_support/types/rel" }
types_scan = { path = "../../../_support/types/types_scan" }
types_snapshot = { path = "../../../_support/types/snapshot" }
types_slot = { path = "../../../_support/types/types_slot" }
types_storage = { path = "../../../_support/types/types_storage" }
smgr_seams = { path = "../../storage/smgr/smgr_seams" }
types_tuple = { path = "../../../_support/types/types_tuple" }
tableam_vocab = { path = "../table/tableam_vocab" }
exectuples = { path = "../../executor/exectuples" }
relpath = { path = "../../../common/relpath" }
init_small = { path = "../../utils/init/init_small" }
xact_seams = { path = "../transam/xact_seams" }
transam_seams = { path = "../transam/transam_seams" }
snapmgr = { path = "../../utils/time/snapmgr" }
inval = { path = "../../utils/cache/inval" }
tuplesort_seams = { version = "0.0.0", path = "../../utils/sort/tuplesort_seams" }
mbutils_seams = { path = "../../utils/mb/mbutils_seams" }

# zstd links C (zstd-sys); no wasm32 build. The wasm arm refuses the codec
# at the two call sites (reader/writer) -- cbstore zstd frames are not
# readable on wasm until a pure-Rust decoder is adopted (documented out).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
zstd = "0.13"

[dev-dependencies]
laneexec = { path = "../../executor/laneexec" }
tuplesort = { path = "../../utils/sort/tuplesort" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(pgrust_sim)'] }
