[package]
name = "sink"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "sink"
path = "src/lib.rs"

[dependencies]
mcx = { path = "../../../_support/mcx" }
types_core = { path = "../../../_support/types/types_core" }
types_error = { path = "../../../_support/types/types_error" }
# TablespaceInfo lives in xlogbackup (transam layer) to avoid a layering
# inversion: transam_xlog cannot depend on sink. Sink's own code stays no_std;
# this dep is only linked transitively.
xlogbackup = { path = "../../access/transam/xlogbackup" }
