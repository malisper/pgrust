[package]
name = "runtime"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "runtime"
path = "src/lib.rs"

# MERGE NOTE (m0-integration): lane B shipped this crate dependency-free with
# a cfg(m0_harvest_lifecycle) lifecycle shim; the M0 merge swapped in lane A's
# real lifecycle.rs (design-donor extraction of the qualified scan-task
# lifecycle), which carries the error/interrupt seams below. The scheduler
# core stays loom-modelable: everything the models drive synchronizes through
# src/sync.rs; the heavy binder re-export (`parallel`) is cfg(not(loom)) so
# the loom build cone stays small.
[dependencies]
types_error = { path = "../../../_support/types/types_error" }
init_small = { path = "../../utils/init/init_small" }
postgres_seams = { path = "../../tcop/postgres_seams" }

[target.'cfg(not(loom))'.dependencies]
# The query-task binder re-export (pinned M0 interface QueryTaskGuard) is
# production-only: loom models drive the lifecycle directly.
parallel = { path = "../../access/transam/parallel" }

# Loom is cfg-gated, not feature-gated, so release binaries can never link
# it: build the models with
#   RUSTFLAGS="--cfg loom" cargo test -p runtime --test loom --release
[target.'cfg(loom)'.dependencies]
loom = "0.7"

# The donor lifecycle loom model (lifecycle.rs mod tests) drives loom atomics
# explicitly and runs under PLAIN `cargo test -p runtime` (the waiter crate
# set this dual-declaration precedent). Dev-deps never reach release builds.
[dev-dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
