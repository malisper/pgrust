# durability off — PG "Non-Durable Settings" chapter, all of them
fsync = off
synchronous_commit = off
full_page_writes = off
wal_level = minimal
max_wal_senders = 0

# background noise off
autovacuum = off
checkpoint_timeout = 1h
max_wal_size = 8GB          # never checkpoint from WAL volume mid-suite

# test-shaped defaults
file_copy_method = clone     # layer 3
jit = off                    # cost misestimates fire JIT on tiny test tables
shared_buffers = 128MB       # small: keeps forced FILE_COPY checkpoints cheap

# mint machinery
pgrust.ephemeral_db_wal_log_threshold = 50   # measured crossover: wal_log wins at >=~50 swept relations (SPEED-REPORT), file_copy wins tiny templates
pgrust.ephemeral_db_mint_roles = '*'         # this profile declares a DISPOSABLE test server: mint gating is friction without protection here; standalone janitors keep the fail-closed '' default
