[package]
name = "tidbitmap"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
allocator-api2 = { version = "0.2", default-features = false, features = ["alloc"] }
mcx = { path = "../../../_support/mcx" }
rustc-hash = { version = "2", default-features = false }
types_core = { path = "../../../_support/types/types_core" }
types_error = { path = "../../../_support/types/types_error" }
types_nodes = { path = "../../../_support/types/nodes" }
types_storage = { path = "../../../_support/types/types_storage" }
types_tuple = { path = "../../../_support/types/types_tuple" }
hashbrown = { version = "0.14", default-features = false, features = ["allocator-api2", "inline-more", "raw"] }
