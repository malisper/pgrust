[features]
# The non-default GEQO recombination operators (PMX/CX/PX/OX1/OX2 + mutation +
# the City table) are `#if defined(...)` in C, compiled out of the default
# build (C ships `#define ERX`). This feature renders that ifdef discipline:
# the faithful ports compile only when it is set; the default build carries ERX
# alone, exactly as C does.
geqo_nondefault_operators = []

