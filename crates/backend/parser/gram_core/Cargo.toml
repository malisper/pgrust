[package]
name = "gram_core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
mcx = { path = "../../../_support/mcx" }
parser_seams = { path = "../parser_seams" }
parser_small1 = { path = "../parser_small1" }
scan_fgram = { path = "../scan_fgram" }
types_core = { path = "../../../_support/types/types_core" }
types_error = { path = "../../../_support/types/types_error" }
types_nodes = { path = "../../../_support/types/nodes" }

[features]
# Fuzz-only: unported grammar actions return a sentinel-SQLSTATE PgError
# instead of panicking, so the differential fuzz driver can classify the
# UNPORTED carve without unwinding. Never enable outside fuzz/.
unported-soft = []
# Fuzz-only: expose the nodeToStringWithLocations renderer (tests_dump) as a
# public module — the tree plane of fuzz/core's gram_core_diff target.
dump = []
