[package]
name = "janitor"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "janitor"
path = "src/lib.rs"

# pgsync::process_global! expands cfg(loom)/cfg(pgrust_sim) arms (the pgsync
# and latch Cargo.toml precedent).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)", "cfg(pgrust_sim)"] }

