# owner's pid (GetPGProcByNumber, :114); target_desc renders the smgr path
# like smgr_aio_describe_identity.
aio_core = { path = "../aio_core" }
lmgr_proc = { path = "../../lmgr/lmgr_proc" }
init_small = { path = "../../../utils/init/init_small" }
relpath_seams = { path = "../../../../common/relpath_seams" }
