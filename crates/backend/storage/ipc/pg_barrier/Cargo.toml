[package]
name = "pg_barrier"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "pg_barrier"
path = "src/lib.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[dependencies]
init_small = { path = "../../../utils/init/init_small" }
# PERMIT-S2 absorb (compose §1.3): sync types come from pgsync, THE single
# world-cfg point (native = std re-export; --cfg loom = loom's checked types).
pgsync = { path = "../../../../_support/pgsync" }
postgres_seams = { path = "../../../tcop/postgres_seams" }
types_error = { path = "../../../../_support/types/types_error" }
waiter = { path = "../waiter" }

# Model glue only: the cfg(loom) park route still uses loom::lazy_static! /
# loom::thread_local! (per-iteration reset — no pgsync papering exists nor
# should: models own their registries). Sync TYPES all come from pgsync.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[dev-dependencies]
loom = "0.7"
