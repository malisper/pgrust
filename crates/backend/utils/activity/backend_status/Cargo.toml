[package]
name = "backend_status"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "backend_status"
path = "src/lib.rs"

[features]
# `ssl` (default ON) = C's USE_SSL arm of pgstat_bestart_security; see
# be_secure/Cargo.toml for the fencing rationale (wasm32 cannot build
# vendored OpenSSL).
default = ["ssl"]
ssl = ["dep:be_secure_openssl"]

[dependencies]
types_core = { path = "../../../../_support/types/types_core" }
types_error = { path = "../../../../_support/types/types_error" }
types_storage = { path = "../../../../_support/types/types_storage" }
ip = { path = "../../../../common/ip" }
init_small = { path = "../../init/init_small" }
miscinit = { path = "../../init/miscinit" }
guc_tables = { path = "../../misc/guc_tables" }
mbutils = { path = "../../mb/mbutils" }
adt_timestamp = { path = "../../adt/adt_timestamp" }
xact = { path = "../../../access/transam/xact" }
pgstat = { path = "../pgstat" }
lmgr_proc = { path = "../../../storage/lmgr/lmgr_proc" }
procarray = { path = "../../../storage/ipc/procarray" }
shmem = { path = "../../../storage/ipc/shmem" }
ipc_seams = { path = "../../../storage/ipc/ipc_seams" }
superuser_seams = { path = "../../misc/superuser_seams" }
backend_status_seams = { path = "../backend_status_seams" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
be_secure_openssl = { path = "../../../libpq/be_secure_openssl", optional = true }

[dev-dependencies]
guc_seams = { path = "../../misc/guc_seams" }
lwlock = { path = "../../../storage/lmgr/lwlock" }
pg_sema_seams = { path = "../../../port/pg_sema_seams" }
s_lock_seams = { path = "../../../storage/lmgr/s_lock_seams" }
latch_seams = { path = "../../../storage/ipc/latch_seams" }
miscinit_seams = { path = "../../init/miscinit_seams" }
waitevent_seams = { path = "../waitevent_seams" }
deadlock_seams = { path = "../../../storage/lmgr/deadlock_seams" }
pmsignal_seams = { path = "../../../storage/ipc/pmsignal_seams" }
lock_seams = { path = "../../../storage/lmgr/lock_seams" }
timeout_seams = { path = "../../misc/timeout_seams" }
condition_variable_seams = { path = "../../../storage/lmgr/condition_variable_seams" }
syncrep_seams = { path = "../../../replication/syncrep_seams" }
autovacuum_seams = { path = "../../../postmaster/autovacuum_seams" }
