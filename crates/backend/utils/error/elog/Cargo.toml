[package]
name = "elog"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "elog"
path = "src/lib.rs"

[dependencies]
pg_clock = { path = "../../../../port/pg_clock" }
guc_tables = { path = "../../misc/guc_tables" }
types_core = { path = "../../../../_support/types/types_core" }
types_error = { path = "../../../../_support/types/types_error" }
types_dest = { path = "../../../../_support/types/types_dest" }
elog_seams = { path = "../elog_seams" }
error_small_seams = { path = "../error_small_seams" }
init_small_seams = { path = "../../init/init_small_seams" }
pgstat_seams = { path = "../../activity/pgstat_seams" }
syslogger_seams = { path = "../../../postmaster/syslogger_seams" }
ipc_seams = { path = "../../../storage/ipc/ipc_seams" }
pqcomm_seams = { path = "../../../libpq/pqcomm_seams" }
libc = "0.2"
mcx = { path = "../../../../_support/mcx" }
mbutils_seams = { path = "../../mb/mbutils_seams" }

# `pgrust_sim` (non-default cfg): P4 sim arms live behind it; empty/absent
# in product builds (law 0.1).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(pgrust_sim)'] }
