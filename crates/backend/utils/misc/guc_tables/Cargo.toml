[package]
name = "guc_tables"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "guc_tables"
path = "src/lib.rs"

[features]
# Compiles in the C test module's oauth_validator.* GUCs; enabled only by
# main_main's oauth-test-validator feature (never in a product build).
oauth-test-validator = []

[dependencies]
types_error = { path = "../../../../_support/types/types_error" }
types_guc = { path = "../../../../_support/types/types_guc" }
guc_seams = { path = "../guc_seams" }

# `pgrust_sim` mirrors vfs's declaration (contract §1.2): non-default cfg set
# only by the sim harness's RUSTFLAGS; gates the "clone" file_copy_method
# entry to the platforms whose kernel clone_file can reach.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(pgrust_sim)'] }
