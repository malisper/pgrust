[package]
name = "controldata_utils"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "controldata_utils"
path = "src/lib.rs"

[dependencies]
# DST P1 census delta 4: common/ crate, cannot dep backend fd; plain dep on
# the leaf vfs crate instead (vfs has no backend deps by construction).
vfs = { path = "../../backend/storage/file/vfs" }
libc = "0.2"
pg_clock = { path = "../../port/pg_clock" }
crc32c = { path = "../../port/crc32c" }
elog = { path = "../../backend/utils/error/elog" }
types_core = { path = "../../_support/types/types_core" }
types_error = { path = "../../_support/types/types_error" }
# controldata_utils.c:235/250 `#ifndef FRONTEND` pgstat_report_wait_* arm:
# the wait seams (seam_core only — no backend cone); a process that never
# installs them (frontend bins, plain crate tests) is C's FRONTEND build.
waitevent_seams = { path = "../../backend/utils/activity/waitevent_seams" }
# controldata_utils.c:90/222/260 `#ifndef FRONTEND` fd.c arms, same shape.
file_seams = { path = "../../backend/storage/file/file_seams" }

# `pgrust_sim` (non-default cfg, set only by the sim harness RUSTFLAGS): the
# close-fault witness tests/sim_close_fault.rs lives behind it.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(pgrust_sim)'] }
