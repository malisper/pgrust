mbutils = { path = "../../backend/utils/mb/mbutils" }
ts_locale = { path = "../../backend/tsearch/ts_locale" }
oracle_compat = { package = "adt_oracle_compat", path = "../../backend/utils/adt/oracle_compat" }
crc32c = { path = "../../port/crc32c" }
detoast = { path = "../../backend/access/common/detoast" }
