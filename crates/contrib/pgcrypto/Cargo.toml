[package]
name = "pgcrypto"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "pgcrypto"
path = "src/lib.rs"

[dependencies]
datum = { path = "../../_support/types/datum" }
mcx = { path = "../../_support/mcx" }
types_core = { path = "../../_support/types/types_core" }
types_error = { path = "../../_support/types/types_error" }
types_fmgr = { path = "../../_support/types/fmgr" }
varlena = { path = "../../backend/utils/adt/varlena" }
adt_uuid = { path = "../../backend/utils/adt/uuid" }
pg_md5 = { path = "../../common/md5" }
pg_sha1 = { path = "../../common/sha1" }
pg_sha2 = { path = "../../common/sha2" }
pg_strong_random = { path = "../../port/pg_strong_random" }
dfmgr = { path = "../../backend/utils/fmgr/dfmgr" }

# RustCrypto symmetric ciphers for encrypt()/decrypt() — byte-identical to
# pgcrypto's OpenSSL px_combo_* (see cipher.rs). Third-party crates are policy-
# acceptable (AGENTS.md direct-dep default; the repo already vendors openssl).
aes = "0.8"
blowfish = "0.9"
des = "0.8"
cast5 = "0.11"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
ecb = { version = "0.1", features = ["alloc", "block-padding"] }
cfb-mode = "0.8"
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
