[package]
name = "pgcrypto"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "pgcrypto"
path = "src/lib.rs"

[dependencies]
pg_string = { path = "../../common/string" }
datum = { path = "../../_support/types/datum" }
mcx = { path = "../../_support/mcx" }
types_core = { path = "../../_support/types/types_core" }
types_error = { path = "../../_support/types/types_error" }
types_fmgr = { path = "../../_support/types/fmgr" }
varlena = { path = "../../backend/utils/adt/varlena" }
adt_uuid = { path = "../../backend/utils/adt/uuid" }
pg_md5 = { path = "../../common/md5" }
pg_sha1 = { path = "../../common/sha1" }
pg_sha2 = { path = "../../common/sha2" }
pg_strong_random = { path = "../../port/pg_strong_random" }
elog = { path = "../../backend/utils/error/elog" }
guc = { path = "../../backend/utils/misc/guc" }
dfmgr = { path = "../../backend/utils/fmgr/dfmgr" }
mbutils = { path = "../../backend/utils/mb/mbutils" }
arrayfuncs = { path = "../../backend/utils/adt/arrayfuncs" }
# CHECK_FOR_INTERRUPTS in the bcrypt/sha-crypt cost loops (C parity).
postgres_seams = { path = "../../backend/tcop/postgres_seams" }
funcapi = { path = "../../backend/utils/fmgr/funcapi" }
types_tuple = { path = "../../_support/types/types_tuple" }

# RustCrypto symmetric ciphers for encrypt()/decrypt() — byte-identical to
# pgcrypto's OpenSSL px_combo_* (see cipher.rs). Third-party crates are policy-
# acceptable (AGENTS.md direct-dep default; the repo already vendors openssl).
aes = "0.8"
blowfish = { version = "0.9", features = ["bcrypt"] }
des = "0.8"
# Traditional/xdes DES crypt is self-contained (crypt/cryptdes.rs); sha-crypt
# ($5$/$6$) is in-tree (crypt/shacrypt.rs) over pg_sha2 so its rounds loop
# carries CHECK_FOR_INTERRUPTS.
cast5 = "0.11"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
ecb = { version = "0.1", features = ["alloc", "block-padding"] }
cfb-mode = "0.8"
cipher = { version = "0.4", features = ["alloc", "block-padding"] }

# OpenPGP (pgp-*.c): ZIP/ZLIB packet compression, and RSA/ElGamal MPI math
# (modexp/modinverse) mirroring pgcrypto's OpenSSL BIGNUM path.
miniz_oxide = "0.8"
num-bigint = "0.4"
num-traits = "0.2"
