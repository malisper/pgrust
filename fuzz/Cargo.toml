# pg_lsn_diff (Lane-0A p1 campaign, 2026-07-30): composite pg_lsn family
# target — in/out/roundtrip/cmp-family/recv/send + the four DigitBuf-blocked
# arithmetic rows (pg_lsn_mi/pli/mii, numeric_pg_lsn) run against verbatim
# vendored 18.3 numeric.c (set_var_from_str -> add_var/sub_var ->
# numericvar_to_uint64 / make_result, csrc/pg_lsn_oracle.c). First campaign
# (macOS host, C-side sancov ON): 10.3M logged execs (0.3M + 3M + 7M legs)
# + ~20M more in an unlogged 900 s leg, cov 1548 edges, ZERO divergences;
# one crash artifact triaged = oracle-arena undersizing (fixed, not a
# divergence). fc_* fmgr wrappers driven via LocalFcinfo for builtins.rs
# line coverage. Carves in core/src/lsn_diff.rs module doc.
# encode_diff: scaffolded by fuzz/scaffold.py — see README-TODO-encode_diff.md.
[[bin]]
name = "encode_diff"
path = "fuzz_targets/encode_diff.rs"
test = false
doc = false
bench = false

