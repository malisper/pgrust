# cargo-fuzz (libFuzzer) wrapper for pgrust-fast byte-level decoders.
#
#   Run (needs a nightly toolchain — libFuzzer/sanitizers are nightly-only;
#   the repo's pinned stable 1.96.0 cannot build these targets):
#     cargo +nightly fuzz run wal_record    -- -max_total_time=300
#     cargo +nightly fuzz run wire_pqformat -- -max_total_time=300
#
# The decode-driving logic lives in ./core (crate `decoder_fuzz`), which builds
# and unit-tests on stable; these targets are thin libFuzzer shells over it.
#
# Differential targets (2026-07-30 lane): float_in_diff / float_out_diff /
# geo_diff run shipped Rust against verbatim vendored REL_18 PostgreSQL C
# (core/csrc/, compiled by core/build.rs) in-process, comparing value +
# error + errcode exactly; a libFuzzer crash artifact = a C/Rust divergence
# reproducer. First campaign (macOS host oracle): float_in 31.6M cases,
# float_out 23.7M, geo 24.7M — one REAL divergence found and confirmed vs
# docker postgres:18 (open-path on_ppath overflow, see
# core/src/diff.rs tests::on_ppath_overflow_divergence_witness and the
# carve comments in diff.rs; float I/O: zero divergences).
[package]
name = "pgrust-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

# Sole workspace root for the fuzz tooling (detached from the repo-root
# workspace so nightly-only deps never touch the stable build). `core` is the
# stable-buildable decode-driver library; the crates it path-depends on resolve
# their own workspace inheritance against the repo root.
[workspace]
members = ["core"]

[dependencies]
libfuzzer-sys = "0.4"
decoder_fuzz = { path = "core" }

[[bin]]
name = "wal_record"
path = "fuzz_targets/wal_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_pqformat"
path = "fuzz_targets/wire_pqformat.rs"
test = false
doc = false
bench = false

# Differential targets: shipped Rust vs vendored PostgreSQL C oracle
# (proofs-ledger excluded(wall) rows). Any comparator mismatch panics, so a
# libFuzzer "crash" artifact here is a C/Rust DIVERGENCE reproducer.
[[bin]]
name = "float_in_diff"
path = "fuzz_targets/float_in_diff.rs"
test = false
doc = false
bench = false

[[bin]]
name = "float_out_diff"
path = "fuzz_targets/float_out_diff.rs"
test = false
doc = false
bench = false

[[bin]]
name = "geo_diff"
path = "fuzz_targets/geo_diff.rs"
test = false
doc = false
bench = false

# libm math family (2026-07-30 lane): the 38 blocked(libm)/blocked(seam:
# libm-oracle) ledger rows. Both sides call the REAL platform libm — the
# thing a Kani seam would have defined away. First campaign (macOS host
# oracle): float_math 34.7M coverage-guided + 280M sampler cases (10M per
# unary fn via core/examples/float_math_sample.rs), float_math2 33.8M
# coverage-guided + 30M sampler. One divergence candidate found and
# adjudicated as an ORACLE COMPILER ARTIFACT (clang -ffp-contract=on fmsub
# fusion in the degree-trig scaling expressions; real PG 18.4 aarch64
# docker returns a third value again — glibc acos ulp drift), carved by
# pinning -ffp-contract=off in core/build.rs; see diff.rs
# tests::dasind_fp_contraction_witness. Zero wrapper-logic divergences.
# char/bool differential targets (phase-1 100%-coverage campaign,
# proofs/p1-lane0a): cores + fc_* fmgr wrappers vs vendored 18.3 C.
[[bin]]
name = "char_diff"
path = "fuzz_targets/char_diff.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bool_diff"
path = "fuzz_targets/bool_diff.rs"
