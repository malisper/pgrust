# Decoder-fuzz core: the actual byte->decoder driving logic, as a plain library
# buildable on the pinned stable toolchain (no libfuzzer). The cargo-fuzz crate
# in ../ wraps these functions in libfuzzer targets (nightly). Keeping the logic
# here lets `cargo test` smoke it on stable without cargo-fuzz installed.
[package]
name = "decoder_fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "decoder_fuzz"
path = "src/lib.rs"

[dependencies]
mcx = { path = "../../crates/_support/mcx" }
types_core = { path = "../../crates/_support/types/types_core" }
types_error = { path = "../../crates/_support/types/types_error" }
crc32c = { path = "../../crates/port/crc32c" }
xlogreader = { path = "../../crates/backend/access/transam/xlogreader" }
xlogreader_seams = { path = "../../crates/backend/access/transam/xlogreader_seams" }
pqformat = { path = "../../crates/backend/libpq/pqformat" }
stringinfo = { path = "../../crates/_support/types/stringinfo" }
mbutils = { path = "../../crates/backend/utils/mb/mbutils" }
wchar = { path = "../../crates/common/wchar" }
# Differential targets (shipped Rust vs vendored C oracle in csrc/):
adt_float = { path = "../../crates/backend/utils/adt/float" }
adt_geo = { path = "../../crates/backend/utils/adt/geo" }
adt_encode = { path = "../../crates/backend/utils/adt/encode" }  # encode_diff (scaffold.py)
datum = { path = "../../crates/_support/types/datum" }  # fc-wrapper plane (scaffold.py)
types_fmgr = { path = "../../crates/_support/types/fmgr" }  # fc-wrapper plane (scaffold.py)
adt_date = { path = "../../crates/backend/utils/adt/adt_date" }  # datetime_io_diff (scaffold.py)
adt_datetime = { path = "../../crates/backend/utils/adt/adt_datetime" }  # datetime_io_diff
adt_timestamp = { path = "../../crates/backend/utils/adt/adt_timestamp" }  # datetime_io_diff env pin
pgtz = { path = "../../crates/backend/timezone/pgtz" }  # datetime_io_diff env pin
guc_tables = { path = "../../crates/backend/utils/misc/guc_tables" }  # datetime_io_diff env pin
elog = { path = "../../crates/backend/utils/error/elog" }  # datetime_io_diff env pin
fd = { path = "../../crates/backend/storage/file/fd" }  # datetime_io_diff env pin
xact_seams = { path = "../../crates/backend/access/transam/xact_seams" }  # datetime_io_diff env pin
timestamp_seams = { path = "../../crates/backend/utils/adt/timestamp_seams" }  # datetime_io_diff env pin

[build-dependencies]
cc = "1"
