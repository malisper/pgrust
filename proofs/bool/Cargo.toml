[package]
name = "proof-bool"
version = "0.1.0"
edition = "2021"

[dependencies]
# Prove the SHIPPED port, not a copy.
adt_bool = { path = "../../crates/backend/utils/adt/bool" }
# int4_bool / bool_int4 (oids 2557/2558) cores live in adt_int.
adt_int = { path = "../../crates/backend/utils/adt/int" }
# bool_accum_inv NULL-state error arm (stub_pg_error_error); mcx-stubs for
# the boolsend/booltext wrapper-level frames (static-buffer allocator model).
proof_support = { path = "../support", features = ["mcx-stubs"] }
types_error = { path = "../../crates/_support/types/types_error" }
# --- send/text wire rows (2437/2971): wrapper-level LocalFcinfo frames ---
datum = { path = "../../crates/_support/types/datum" }
types_fmgr = { path = "../../crates/_support/types/fmgr" }
mcx = { path = "../../crates/_support/mcx" }

[workspace]
